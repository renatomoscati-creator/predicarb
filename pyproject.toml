[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "predicarb"
version = "1.0.0"
description = "Polymarket arbitrage/edge trading bot with live benchmark signals and TUI dashboard"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "cryptography>=41.0.0",
    "websockets>=12.0",
    "textual>=0.61.0",
    "feedparser>=6.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "scipy>=1.11",
]

[project.scripts]
predicarb = "src.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
